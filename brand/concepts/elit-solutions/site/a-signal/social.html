<style>
:root {
  --font: 'BI Instrument Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* identity type slots: brand.py site fills them through fonts CSS; default = the bundled face */
  --bi-font-text: var(--font);
  --bi-font-display: var(--bi-font-text);
  --bi-fvs-text: normal;
  --bi-fvs-display: normal;
  --z-post: 0.7;
  --z-story: 0.39375;
  --tile-1: color-mix(in oklab, var(--bi-on-primary) 13%, var(--bi-primary));
  --tile-2: color-mix(in oklab, var(--bi-on-primary) 28%, var(--bi-primary));
  --on-primary-soft: color-mix(in oklab, var(--bi-on-primary) 78%, var(--bi-primary));
  --shadow: 0 2px 4px color-mix(in oklab, var(--bi-text) 8%, transparent),
            0 40px 80px -24px color-mix(in oklab, var(--bi-text) 30%, transparent);
}
[data-theme="dark"] {
  color-scheme: dark;
  --shadow: 0 0 0 2px color-mix(in oklab, var(--bi-border) 80%, transparent),
            0 40px 80px -24px color-mix(in oklab, var(--bi-background) 90%, transparent);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bi-surface-alt); color: var(--bi-text); font-family: var(--bi-font-text); font-variation-settings: var(--bi-fvs-text); -webkit-font-smoothing: antialiased; }
[data-theme="dark"] body { background: var(--bi-background); }
p { margin: 0; }
svg { display: block; }

.board { min-height: 100vh; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 32px 40px; }
.item { display: grid; gap: 14px; justify-items: start; }
.cap { font-size: 13px; color: var(--bi-text-muted); }
.cap b { color: var(--bi-text); font-weight: 600; }

.brand { display: inline-flex; align-items: center; gap: .42em; }
.brand-logo { display: inline-flex; width: 1.3em; height: 1.3em; flex: none; color: inherit; }
.brand-logo:empty { display: none; }
.brand-logo svg { width: 100%; height: 100%; }
/* identity logo: a full lockup (symbol + name drawn) replaces the symbol + typed name pair */
html[data-logo="lockup"] .brand-logo { width: auto; }
html[data-logo="lockup"] .brand-logo svg { width: auto; height: 100%; }
html[data-logo="lockup"] .brand .brand-logo:not(:empty) + .brand-word { display: none; }
h1, h2, h3, .brand-word, .av-letter { font-family: var(--bi-font-display); font-variation-settings: var(--bi-fvs-display); }
.brand-word { font-weight: 680; font-stretch: 84%; letter-spacing: -0.025em; white-space: nowrap; }

.t { position: relative; overflow: hidden; }
.t::before { content: ""; position: absolute; inset: 0; background: var(--c, var(--tile-1)); }
.t.qa::before { border-radius: 0 0 0 100%; } .t.qb::before { border-radius: 100% 0 0 0; } .t.qc::before { border-radius: 0 100% 0 0; } .t.qd::before { border-radius: 0 0 100% 0; }
.t.hf::before { top: 50%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.t.ci::before { inset: 14%; border-radius: 50%; }
.t.no::before { display: none; }
.c1 { --c: var(--tile-1); } .c2 { --c: var(--tile-2); } .c3 { --c: var(--bi-on-primary); } .ca { --c: var(--bi-accent); }
/* extended palette in the brand pattern: falls back to the core tiles */
.e1 { --c: var(--bi-ext-1, var(--tile-1)); } .e2 { --c: var(--bi-ext-2, var(--bi-accent)); } .e3 { --c: var(--bi-ext-3, var(--tile-1)); }

/* square post */
.post { zoom: var(--z-post); width: 1080px; height: 1080px; position: relative; overflow: hidden; border-radius: 6px; box-shadow: var(--shadow); background: var(--bi-primary); color: var(--bi-on-primary); display: grid; grid-template-rows: auto 1fr auto; }
.post-top { display: flex; justify-content: space-between; align-items: center; padding: 72px 80px 0; }
.post-top .brand { font-size: 46px; }
.post-date { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--on-primary-soft); }
.post-mid { padding: 0 80px; align-self: center; margin-top: -40px; }
.post h2 { margin: 0; font-size: 132px; line-height: .92; font-weight: 650; font-stretch: 78%; letter-spacing: -0.045em; max-width: 8.2em; text-wrap: balance; }
.post-mid p { margin-top: 36px; font-size: 34px; line-height: 1.3; color: var(--on-primary-soft); max-width: 17em; }
.post-tiles { display: grid; grid-template-columns: repeat(6, 1fr); height: 180px; }
.sticker { position: absolute; right: 88px; bottom: 236px; width: 210px; height: 210px; border-radius: 50%; background: var(--bi-accent); color: var(--bi-on-accent); display: grid; place-items: center; text-align: center; font-size: 34px; font-weight: 680; font-stretch: 85%; line-height: 1.02; letter-spacing: -0.02em; transform: rotate(10deg); }

/* story */
.story { zoom: var(--z-story); width: 1080px; height: 1920px; position: relative; overflow: hidden; border-radius: 28px; box-shadow: var(--shadow); background: var(--bi-background); color: var(--bi-text); display: flex; flex-direction: column; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 36px 40px 0; }
.bars i { height: 7px; border-radius: 4px; background: color-mix(in oklab, var(--bi-text) 18%, transparent); position: relative; overflow: hidden; }
.bars i.done { background: var(--bi-text); }
.bars i.half::after { content: ""; position: absolute; inset: 0 55% 0 0; background: var(--bi-text); }
.story-head { display: flex; align-items: center; gap: 22px; padding: 32px 40px 0; font-size: 34px; }
.av { width: 84px; height: 84px; border-radius: 50%; background: var(--bi-primary); color: var(--bi-on-primary); display: grid; place-items: center; flex: none; box-shadow: 0 0 0 5px var(--bi-background), 0 0 0 9px var(--bi-accent); }
.av .brand-logo { width: 44px; height: 44px; }
.av .brand-logo:not(:empty) + .av-letter { display: none; }
.av-letter { font-size: 46px; font-weight: 700; font-stretch: 85%; line-height: 1; }
.story-head b { font-weight: 650; }
.story-head .ago { color: var(--bi-text-muted); }
.story-body { flex: 1; padding: 150px 88px 0; display: flex; flex-direction: column; }
.label { display: inline-flex; align-self: flex-start; align-items: center; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--bi-surface); border: 2px solid var(--bi-border); font-size: 30px; font-weight: 600; }
.story blockquote { margin: 64px 0 0; font-size: 92px; line-height: 1.06; font-weight: 600; font-stretch: 86%; letter-spacing: -0.035em; }
.qmark { width: 88px; height: 88px; color: var(--bi-accent); margin-top: 72px; }
.story blockquote { margin-top: 28px; }
.attr { display: flex; align-items: center; gap: 24px; margin-top: 56px; font-size: 32px; }
.attr .pic { width: 92px; height: 92px; border-radius: 50%; background: color-mix(in oklab, var(--bi-primary) 14%, var(--bi-surface)); display: grid; place-items: center; font-weight: 650; font-size: 32px; }
.attr b { display: block; font-weight: 650; }
.attr div span { color: var(--bi-text-muted); }
.stars { display: flex; gap: 10px; margin-top: 56px; color: var(--bi-accent); align-items: center; }
.stars svg { width: 48px; height: 48px; }
.stars span { margin-left: 14px; font-size: 32px; color: var(--bi-text-muted); }
.story-cta { margin: auto 40px 0; border-radius: 40px; background: var(--bi-primary); color: var(--bi-on-primary); display: grid; grid-template-columns: 1fr 300px; overflow: hidden; height: 420px; }
.cta-copy { padding: 56px 0 56px 56px; display: flex; flex-direction: column; justify-content: space-between; }
.cta-copy h3 { margin: 0; font-size: 64px; line-height: 1; font-weight: 650; font-stretch: 82%; letter-spacing: -0.035em; }
.link-sticker { display: inline-flex; align-self: flex-start; align-items: center; gap: 16px; height: 88px; padding: 0 36px 0 28px; border-radius: 22px; background: var(--bi-surface); color: var(--bi-link); font-size: 34px; font-weight: 650; box-shadow: 0 8px 24px color-mix(in oklab, var(--bi-text) 18%, transparent); }
.link-sticker svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.cta-tiles { display: grid; grid-template-columns: repeat(2, 150px); grid-template-rows: repeat(3, 140px); align-content: center; }
.reply { display: flex; align-items: center; gap: 28px; padding: 40px 40px 56px; }
.reply span { flex: 1; height: 96px; border-radius: 48px; border: 3px solid color-mix(in oklab, var(--bi-text) 30%, transparent); display: flex; align-items: center; padding: 0 40px; font-size: 32px; color: var(--bi-text-muted); }
.reply svg { width: 56px; height: 56px; fill: none; stroke: var(--bi-text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 1100px) {
  :root { --z-post: 0.56; --z-story: 0.315; }
}
@media (max-width: 760px) {
  :root { --z-post: 0.3315; --z-story: 0.3315; }
  .board { flex-direction: column; align-items: center; justify-content: flex-start; gap: 28px; padding: 16px 16px 40px; }
}
</style>

<script>
// Copy contract (see copy/README.md): copy JSON becomes a flat {"key": "text"} object. Every element with
// data-copy="key" takes that text ("\n" = line break, "{brand}" = brand name). Unknown or missing keys keep the
// English text written in the markup, so an unfilled template still renders.
(function () {
  var c = {};
  try { c = JSON.parse(document.getElementById('bi-copy').textContent); } catch (e) { c = {}; }
  if (!c || typeof c !== 'object') c = {};
  var bw = document.querySelector('.brand-word');
  var brand = bw ? bw.textContent.trim() : '';
  if (typeof c._lang === 'string') document.documentElement.lang = c._lang;
  document.querySelectorAll('[data-copy]').forEach(function (el) {
    var v = c[el.getAttribute('data-copy')];
    if (typeof v !== 'string') return;
    v = v.split('{brand}').join(brand);
    if (el.tagName === 'INPUT') { el.value = v; return; }
    el.textContent = '';
    v.split('\n').forEach(function (line, i) {
      if (i) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(line));
    });
  });
})();
</script>
<script>
// Monogram and link-sticker domain from the brand name (no network, cosmetic only).
(function () {
  var el = document.querySelector('.brand-word');
  var name = el ? el.textContent.trim() : '';
  if (!name || name.indexOf('{{') === 0) return;
  document.querySelectorAll('[data-initial]').forEach(function (n) { n.textContent = name.charAt(0).toLocaleUpperCase(document.documentElement.lang || 'en'); });
  var map = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'İ': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', '&': 'and' };
  var slug = name.replace(/[çğıİöşü&]/gi, function (c) { return map[c] || map[c.toLowerCase()] || c; })
    .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  if (slug) document.querySelectorAll('[data-web]').forEach(function (n) { n.textContent = slug + '.com'; });
})();
</script>
